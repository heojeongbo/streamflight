name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &paths
      - .github/workflows/ci.yaml
      - "**.go"
      - docker-bake.hcl
      - Dockerfile
      - go.mod
      - go.sum
      - scripts/**
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Both architectures, on native runners: a concurrency library is worth
        # testing on more than one, and emulating the second would be far
        # slower than running it for real.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4

      - name: Test
        uses: docker/bake-action@v7
        with:
          source: .
          targets: test
          # No platform is set, so each runner builds for its own. The cache is
          # scoped per runner so the two do not overwrite each other's.
          set: |
            *.cache-from=type=gha,scope=${{ matrix.runner }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.runner }}
